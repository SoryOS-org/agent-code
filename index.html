    <script>
      // Swallow harmless Vite HMR WebSocket connection errors in dev/iframe environment
      window.addEventListener('error', function (e) {
        if (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('@vite/client') !== -1 || e.filename && e.filename.indexOf('@vite/client') !== -1)) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var str = String(e.reason || '');
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('@vite/client') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
